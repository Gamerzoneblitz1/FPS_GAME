<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multiplayer FPS Game</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    canvas { display: block; }
    #instructions {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      background: red;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="instructions">
    <h1>Click to Play</h1>
    <p>Move: WASD | Jump: SPACE | Look: MOUSE</p>
  </div>
  <div id="crosshair"></div>

  <!-- Load Three.js & Socket.io -->
  <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

  <script>
    const socket = io();

    let camera, scene, renderer, controls;
    const players = {};
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
    let velocity = new THREE.Vector3();
    const clock = new THREE.Clock();

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb); // Sky blue background

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.y = 5;

      // Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(10, 20, 10);
      scene.add(dirLight);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // Pointer Lock Controls (Mouse Look)
      controls = new THREE.PointerLockControls(camera, document.body);
      const instructions = document.getElementById('instructions');

      instructions.addEventListener('click', () => {
        controls.lock();
      });

      controls.addEventListener('lock', () => {
        instructions.style.display = 'none';
      });

      controls.addEventListener('unlock', () => {
        instructions.style.display = 'block';
      });

      scene.add(controls.getObject());

      // Ground Plane
      const groundGeo = new THREE.PlaneGeometry(200, 200);
      const groundMat = new THREE.MeshLambertMaterial({ color: 0x228b22 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      // Socket Listeners
      socket.on('newPlayer', (data) => {
        if (data.id !== socket.id && !players[data.id]) {
          players[data.id] = createPlayerBox();
          scene.add(players[data.id]);
        }
      });

      socket.on('playerMoved', (data) => {
        if (players[data.id]) {
          players[data.id].position.set(data.position.x, data.position.y, data.position.z);
        }
      });

      socket.on('playerDisconnected', (id) => {
        if (players[id]) {
          scene.remove(players[id]);
          delete players[id];
        }
      });

      // Controls setup
      document.addEventListener('keydown', onKeyDown);
      document.addEventListener('keyup', onKeyUp);
      window.addEventListener('resize', onWindowResize);
    }

    function createPlayerBox() {
      const geometry = new THREE.BoxGeometry(2, 4, 2);
      const material = new THREE.MeshLambertMaterial({ color: 0xff0000 });
      const box = new THREE.Mesh(geometry, material);
      box.position.y = 2;
      return box;
    }

    function onKeyDown(event) {
      switch (event.code) {
        case 'KeyW': moveForward = true; break;
        case 'KeyA': moveLeft = true; break;
        case 'KeyS': moveBackward = true; break;
        case 'KeyD': moveRight = true; break;
        case 'Space':
          if (canJump) velocity.y += 15;
          canJump = false;
          break;
      }
    }

    function onKeyUp(event) {
      switch (event.code) {
        case 'KeyW': moveForward = false; break;
        case 'KeyA': moveLeft = false; break;
        case 'KeyS': moveBackward = false; break;
        case 'KeyD': moveRight = false; break;
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();

      if (controls.isLocked) {
        // Gravity logic
        velocity.y -= 30 * delta;

        // Player Movement Speed
        const speed = 25.0;
        if (moveForward) controls.moveForward(speed * delta);
        if (moveBackward) controls.moveForward(-speed * delta);
        if (moveLeft) controls.moveRight(-speed * delta);
        if (moveRight) controls.moveRight(speed * delta);

        camera.position.y += velocity.y * delta;

        // Ground Collision
        if (camera.position.y < 3) {
          velocity.y = 0;
          camera.position.y = 3;
          canJump = true;
        }

        // Broadcast Movement to Server
        const pos = controls.getObject().position;
        socket.emit('playerMove', { x: pos.x, y: pos.y, z: pos.z });
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
