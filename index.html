<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Multiplayer FPS</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; }
        canvas { display: block; }
        #touch-controls {
            position: absolute;
            inset: 0;
            z-index: 5;
            pointer-events: none; /* Kinder aktivieren pointer-events einzeln */
            display: none;
        }
        #joystick-zone {
            position: absolute;
            left: 24px;
            bottom: 24px;
            width: 130px;
            height: 130px;
            pointer-events: auto;
            touch-action: none;
        }
        #joystick-base {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.35);
        }
        #joystick-knob {
            position: absolute;
            width: 54px;
            height: 54px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.55);
        }
        #look-zone {
            position: absolute;
            right: 0;
            top: 0;
            width: 60%;
            height: 100%;
            pointer-events: auto;
            touch-action: none;
        }
        .touch-btn {
            position: absolute;
            pointer-events: auto;
            touch-action: none;
            -webkit-touch-callout: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: white;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #btn-fire {
            right: 28px;
            bottom: 34px;
            width: 88px;
            height: 88px;
            background: rgba(255, 60, 60, 0.25);
            border-color: rgba(255, 90, 90, 0.6);
            font-size: 30px;
        }
        #btn-jump {
            right: 132px;
            bottom: 116px;
            width: 64px;
            height: 64px;
        }
        #btn-reload {
            right: 30px;
            bottom: 138px;
            width: 60px;
            height: 60px;
            font-size: 16px;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background-color: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            border: 2px solid black;
        }
        #hud-bl {
            position: absolute;
            left: 20px;
            bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-family: monospace;
            color: white;
            pointer-events: none;
            user-select: none;
        }
        .hud-row { display: flex; align-items: center; gap: 10px; }
        .hud-icon {
            width: 38px;
            height: 38px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.55);
            font-size: 18px;
            flex-shrink: 0;
        }
        .hud-bar-bg {
            width: 160px;
            height: 14px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            overflow: hidden;
        }
        .hud-bar-fill { height: 100%; transition: width 0.15s ease; }
        #ammo-bar-fill { background: #00f0ff; width: 100%; box-shadow: 0 0 8px #00f0ff; }
        #health-bar-fill { background: #ff3355; width: 100%; box-shadow: 0 0 8px #ff3355; }
        .hud-val { min-width: 70px; font-size: 15px; font-weight: bold; }
        #hud-br {
            position: absolute;
            right: 20px;
            bottom: 20px;
            font-family: monospace;
            color: #00f0ff;
            text-align: right;
            text-shadow: 0 0 8px #00f0ff;
            pointer-events: none;
            user-select: none;
        }
        #distance-val { font-size: 22px; font-weight: bold; }
        #distance-label { font-size: 10px; opacity: 0.7; letter-spacing: 1px; }
        #map-title {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            font-family: monospace;
            color: #00f0ff;
            text-shadow: 0 0 10px #00f0ff;
            font-size: 14px;
            letter-spacing: 3px;
            pointer-events: none;
            user-select: none;
        }
        #instructions {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="crosshair"></div>
    <div id="map-title">NEON VAULT MEGAPLEX</div>

    <div id="hud-bl">
        <div class="hud-row">
            <div class="hud-icon">🔫</div>
            <div class="hud-bar-bg"><div id="ammo-bar-fill" class="hud-bar-fill"></div></div>
            <span id="ammo-val" class="hud-val" style="color: #00f0ff;">12 / 84</span>
        </div>
        <div class="hud-row">
            <div class="hud-icon">❤</div>
            <div class="hud-bar-bg"><div id="health-bar-fill" class="hud-bar-fill"></div></div>
            <span id="health-val" class="hud-val" style="color: #00ff00;">100</span>
        </div>
    </div>

    <div id="hud-br">
        <div id="distance-val">--</div>
        <div id="distance-label">NEAREST TARGET</div>
    </div>
    <div id="instructions">
        <h1>Klicken zum Spielen</h1>
        <p>Steuerung: WASD = Bewegen | LEERTASTE = Springen | R = Nachladen | MAUS = Umsehen & Schießen</p>
    </div>

    <div id="touch-controls">
        <div id="joystick-zone">
            <div id="joystick-base"></div>
            <div id="joystick-knob"></div>
        </div>
        <div id="look-zone"></div>
        <div id="btn-jump" class="touch-btn">⤒</div>
        <div id="btn-reload" class="touch-btn">R</div>
        <div id="btn-fire" class="touch-btn">🔫</div>
    </div>

    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/libs/inflate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/utils/SkeletonUtils.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script type="module" src="js/main.js"></script>
</body>
</html>
