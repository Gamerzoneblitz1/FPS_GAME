<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multiplayer FPS Game</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
    <script src="https://threejs.org/build/three.js"></script>
    <script>
        const socket = io("https://fps-game-e18y.onrender.com");

        let camera, scene, renderer;
        let playerBox, groundPlane;
        const players = {};
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
        let velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const controls = new THREE.PointerLockControls(camera, document.body);
            scene.add(controls.getObject());

            groundPlane = createGround();
            scene.add(groundPlane);

            // Create walls, crates, and pillars
            createArena();

            // Weapon model
            const weaponModel = createWeaponModel();
            scene.add(weaponModel);

            socket.on('playerSpawn', (data) => {
                if (data.id !== socket.id) {
                    players[data.id] = createPlayerBox(data.position);
                    scene.add(players[data.id]);
                }
            });

            socket.on('newPlayer', (data) => {
                players[data.id] = createPlayerBox(data.position);
                scene.add(players[data.id]);
            });

            socket.on('playerMoved', (data) => {
                if (players[data.id]) {
                    players[data.id].position.set(data.position.x, data.position.y, data.position.z);
                }
            });

            socket.on('playerDisconnected', (id) => {
                if (players[id]) {
                    scene.remove(players[id]);
                    delete players[id];
                }
            });

            document.addEventListener('keydown', onDocumentKeyDown, false);
            document.addEventListener('keyup', onDocumentKeyUp, false);

            document.addEventListener('mousedown', shoot, false);

            function createGround() {
                const geometry = new THREE.PlaneGeometry(200, 200);
                const material = new THREE.MeshBasicMaterial({ color: 0x88ccaa, side: THREE.DoubleSide });
                const plane = new THREE.Mesh(geometry, material);
                plane.rotation.x = -Math.PI / 2;
                return plane;
            }

            function createArena() {
                // Outer walls
                const wallGeometry = new THREE.BoxGeometry(1, 5, 198);
                const wallMaterial = new THREE.MeshBasicMaterial({ color: 0x777777 });

                for (let x of [-99, 99]) {
                    const wall = new THREE.Mesh(wallGeometry, wallMaterial);
                    wall.position.set(x, 2.5, 0);
                    scene.add(wall);
                }

                for (let z of [-99, 99]) {
                    const wall = new THREE.Mesh(wallGeometry, wallMaterial);
                    wall.rotation.y = Math.PI / 2;
                    wall.position.set(0, 2.5, z);
                    scene.add(wall);
                }

                // Crates
                for (let i = 0; i < 10; i++) {
                    const crateGeometry = new THREE.BoxGeometry(1, 1, 1);
                    const crateMaterial = new THREE.MeshBasicMaterial({ color: 0xaaaaaa });
                    const crate = new THREE.Mesh(crateGeometry, crateMaterial);
                    crate.position.set(Math.random() * 198 - 99, 0.5, Math.random() * 198 - 99);
                    scene.add(crate);
                }

                // Pillars
                for (let i = 0; i < 20; i++) {
                    const pillarGeometry = new THREE.CylinderGeometry(0.5, 0.5, 4, 32);
                    const pillarMaterial = new THREE.MeshBasicMaterial({ color: 0x888888 });
                    const pillar = new THREE.Mesh(pillarGeometry, pillarMaterial);
                    pillar.position.set(Math.random() * 198 - 99, 2, Math.random() * 198 - 99);
                    scene.add(pillar);
                }
            }

            function createPlayerBox(position) {
                // Simple character model (legs, torso, head)
                const legsGeometry = new THREE.BoxGeometry(0.5, 1, 0.5);
                const legsMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                const legs = new THREE.Mesh(legsGeometry, legsMaterial);
                legs.position.set(position.x, 0.5, position.z);

                const torsoGeometry = new THREE.BoxGeometry(1, 2, 1);
                const torsoMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
                const torso = new THREE.Mesh(torsoGeometry, torsoMaterial);
                torso.position.set(position.x, 1.5, position.z);

                const headGeometry = new THREE.SphereGeometry(0.5, 32, 32);
                const headMaterial = new THREE.MeshBasicMaterial({ color: 0xffff00 });
                const head = new THREE.Mesh(headGeometry, headMaterial);
                head.position.set(position.x, 2.5, position.z);

                const group = new THREE.Group();
                group.add(legs);
                group.add(torso);
                group.add(head);
                return group;
            }

            function createWeaponModel() {
                // Simple weapon model (handle, barrel)
                const handleGeometry = new THREE.BoxGeometry(0.5, 1, 0.2);
                const handleMaterial = new THREE.MeshBasicMaterial({ color: 0x808080 });
                const handle = new THREE.Mesh(handleGeometry, handleMaterial);

                const barrelGeometry = new THREE.CylinderGeometry(0.1, 0.1, 1, 32);
                const barrelMaterial = new THREE.MeshBasicMaterial({ color: 0x7f7f7f });
                const barrel = new THREE.Mesh(barrelGeometry, barrelMaterial);
                barrel.position.set(0, 0.5, 0.6);

                handle.add(barrel);
                handle.position.set(-1, -0.3, 0); // Position weapon model relative to camera
                return handle;
            }

            function onDocumentKeyDown(event) {
                switch (event.keyCode) {
                    case 38: // up
                    case 87: // w
                        moveForward = true;
                        break;

                    case 37: // left
                    case 65: // a
                        moveLeft = true;
                        break;

                    case 40: // down
                    case 83: // s
                        moveBackward = true;
                        break;

                    case 39: // right
                    case 68: // d
                        moveRight = true;
                        break;

                    case 32: // spacebar
                        if (canJump === true) velocity.y += 350;
                        canJump = false;
                        break;
                }
            }

            function onDocumentKeyUp(event) {
                switch (event.keyCode) {
                    case 38: // up
                    case 87: // w
                        moveForward = false;
                        break;

                    case 37: // left
                    case 65: // a
                        moveLeft = false;
                        break;

                    case 40: // down
                    case 83: // s
                        moveBackward = false;
                        break;

                    case 39: // right
                    case 68: // d
                        moveRight = false;
                        break;
                }
            }

            function shoot() {
                const raycaster = new THREE.Raycaster(camera.position, camera.getWorldDirection(new THREE.Vector3()));
                const hit = raycaster.intersectObjects(scene.children);
                if (hit.length > 0) {
                    console.log('Shot at:', hit[0].object);
                    // Implement shooting logic here
                }

                // Recoil animation
                camera.translateZ(1);
                setTimeout(() => {
                    camera.translateZ(-1);
                }, 50);

                // Muzzle flash effect
                const muzzleFlashGeometry = new THREE.SphereGeometry(0.2, 32, 32);
                const muzzleFlashMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const muzzleFlash = new THREE.Mesh(muzzleFlashGeometry, muzzleFlashMaterial);
                muzzleFlash.position.copy(camera.getWorldPosition(new THREE.Vector3())).addScaledVector(camera.getWorldDirection(new THREE.Vector3()), 1.2);
                scene.add(muzzleFlash);

                setTimeout(() => {
                    scene.remove(muzzleFlash);
                }, 50);
            }

            window.addEventListener('resize', onWindowResize, false);

            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }

            const clock = new THREE.Clock();

            socket.emit('playerSpawn');

            function animate() {
                requestAnimationFrame(animate);

                const delta = clock.getDelta();

                velocity.y -= 9.8 * 100.0 * delta; // gravity

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                if (moveForward) controls.moveForward(400 * delta);
                if (moveBackward) controls.moveForward(-400 * delta);
                if (moveLeft) controls.moveRight(-400 * delta);
                if (moveRight) controls.moveRight(400 * delta);

                camera.position.y += velocity.y * delta;

                if (camera.position.y < 5) {
                    velocity.y = 0;
                    camera.position.y = 5;
                    canJump = true;
                }

                const position = { x: controls.getObject().position.x, y: controls.getObject().position.y, z: controls.getObject().position.z };
                socket.emit('playerMove', position);

                renderer.render(scene, camera);
            }
        }
    </script>
</body>
</html>
